services:
  oracle-north:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-north
    environment:
      ORACLE_PASSWORD: password123
    ports:
      - "1530:1521"
    volumes:
      - ./north-init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "system/password123@localhost/XEPDB1"]
      interval: 30s
      timeout: 10s
      retries: 10

  oracle-east:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-east
    environment:
      ORACLE_PASSWORD: password123
    ports:
      - "1531:1521"
    volumes:
      - ./east-init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "system/password123@localhost/XEPDB1"]
      interval: 30s
      timeout: 10s
      retries: 10

  backend:
    build: ./backend
    container_name: travel-backend
    ports:
      - "3001:3001"
    depends_on:
      oracle-north:
        condition: service_healthy
      oracle-east:
        condition: service_healthy
    env_file:
      - ./backend/.env